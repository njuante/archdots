[workspace]
resolver = "2"
members = [
    "crates/archdots-core",
    "crates/archdots",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.85"
authors = ["njuante <juan.nunez1@alu.uclm.es>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/njuante/archdots"
homepage = "https://github.com/njuante/archdots"
readme = "README.md"
keywords = ["dotfiles", "arch", "linux", "ricing", "tui"]
categories = ["command-line-utilities", "config"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
tempfile = "3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "serde-well-known", "macros"] }
serde_json = "1"
rustix = { version = "0.38", features = ["fs"] }
once_cell = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
color-eyre = "0.6"
assert_cmd = "2"
predicates = "3"
similar = "2"
owo-colors = "4"
humantime = "2"
byte-unit = "5"
fuzzy-matcher = "0.3"
arboard = "3"
tracing-appender = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
