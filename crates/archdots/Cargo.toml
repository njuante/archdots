[package]
name = "archdots"
description = "Dotfile manager for Arch Linux ricers — CLI and TUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "archdots"
path = "src/main.rs"

[dependencies]
archdots-core = { path = "../archdots-core" }
clap.workspace = true
ratatui.workspace = true
crossterm.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
color-eyre.workspace = true

[dev-dependencies]
# CLI integration tests: spawn the binary and assert on output/exit code.
assert_cmd = "2"
predicates = "3"
tempfile = "3"
