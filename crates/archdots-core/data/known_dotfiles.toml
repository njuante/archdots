# Known dotfile paths for archdots v0.1.
#
# Each [[entry]] describes one application.
# - name:          unique application identifier
# - paths:         config paths relative to $HOME (all are checked)
# - category:      wm | bar | launcher | terminal | shell | editor |
#                  prompt | compositor | notification | misc
# - optional_deps: extra packages often needed alongside this app (may be empty)

# ── Window managers ───────────────────────────────────────────────────────────

[[entry]]
name = "bspwm"
paths = [".config/bspwm/bspwmrc"]
category = "wm"
optional_deps = ["sxhkd"]

[[entry]]
name = "sxhkd"
paths = [".config/sxhkd/sxhkdrc"]
category = "wm"
optional_deps = []

[[entry]]
name = "i3"
