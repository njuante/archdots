# Secret detection rules for archdots export.
#
# Each rule has:
#   id          — unique identifier (used in findings and --allow-secret)
#   description — human-readable label
#   pattern     — Rust regex syntax (regex::bytes::Regex)
#   severity    — "high" (aborts export) or "medium" (warns, does not block)
#
# Embedded via include_str! in exporter/scanner.rs.

[[rule]]
id          = "aws-access-key-id"
description = "AWS Access Key ID"
pattern     = "AKIA[0-9A-Z]{16}"
severity    = "high"

[[rule]]
id          = "github-token"
description = "GitHub personal access or app token"
pattern     = "gh[ps]_[A-Za-z0-9]{36,}"
severity    = "high"

[[rule]]
id          = "gitlab-token"
description = "GitLab personal access token"
pattern     = "glpat-[A-Za-z0-9_-]{20}"
severity    = "high"

[[rule]]
id          = "slack-token"
description = "Slack bot, app, or user token"
pattern     = "xox[baprs]-[A-Za-z0-9-]+"
severity    = "high"

[[rule]]
id          = "stripe-secret"
description = "Stripe secret key (live or test)"
pattern     = "sk_(live|test)_[A-Za-z0-9]{24,}"
severity    = "high"

[[rule]]
id          = "google-api-key"
description = "Google API key"
pattern     = "AIza[A-Za-z0-9_-]{35}"
severity    = "high"

[[rule]]
id          = "private-key-header"
description = "PEM private key header (RSA, EC, OPENSSH, DSA, or generic)"
pattern     = "-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"
severity    = "high"

[[rule]]
id          = "npm-auth-token"
description = "npm registry authentication token in .npmrc"
pattern     = "//.+/:_authToken="
severity    = "high"

[[rule]]
id          = "jwt"
description = "JSON Web Token (three base64url-encoded segments)"
pattern     = "eyJ[A-Za-z0-9_-]+\\.eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
severity    = "medium"

[[rule]]
id          = "generic-assignment"
description = "Generic API key, secret, token, or password assignment"
pattern     = "(?i)(api[_-]?key|secret|token|password)\\s*[:=]\\s*['\"][A-Za-z0-9_/+=-]{16,}['\"]"
severity    = "medium"
